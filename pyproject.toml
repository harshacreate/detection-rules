[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "detection-rules-lab"
version = "0.1.0"
description = "A tested Sigma and YARA examples lab with synthetic fixtures"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0,<7.0", "yara-python>=4.5,<5.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
